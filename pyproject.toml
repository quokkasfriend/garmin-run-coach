[project]
name = "running-coach"
version = "0.1.0"
description = "Running coach locale: sync Garmin, review di blocco, generazione piano"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-personal-api-python",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1",
    "pandas>=2.2",
    "fitparse>=1.2",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
coach = "coach.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
